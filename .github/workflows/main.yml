name: QA Automation CI Pipeline
on: 
  push:
    branches:
      -  main
  pull_request:
    branches:
      - main
  workflow_dispatch:  
permissions: 
  contents: read
jobs:
  automation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses:  actions/checkout@v4

      - name: Setup Java
        uses: actions/setup_java@v4
        with:
           distribution: tumerin
           version: '17'
           cache: maven

      - name: Generate Build
        run: mvn -B clean compile

      - name:  Execute TestNG tests
        run:  mvn -B clean test

      - name: Generate TestNG Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
  
